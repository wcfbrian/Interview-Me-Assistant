[project]
name = "interview-me-assistant"
version = "0.1.0"
description = "Evidence-grounded interview assistant for candidate conversations."
requires-python = ">=3.12"
dependencies = [
    "chainlit>=2.8,<3",
    "chromadb>=1.1,<2",
    "langchain>=1.1,<2",
    "langchain-chroma>=1.1,<2",
    "langchain-community>=0.4,<1",
    "langchain-openai>=1.1,<2",
    "langgraph>=1.0,<2",
    "pydantic-settings>=2.10,<3",
    "pypdf>=6,<7",
    "rank-bm25>=0.2,<1",
    "deepeval>=3,<4",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
default-groups = ["dev"]