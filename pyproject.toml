[project]
name = "interview-me-assistant"
version = "0.1.0"
description = "A grounded interview assistant represented by a LangGraph agent."
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0.0,<2.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "langchain-openrouter>=0.1.0,<1.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "streamlit>=1.40.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pypdf>=5.0.0,<7.0.0",
    "langchain-chroma>=0.2.0,<1.0.0",
    "rank-bm25>=0.2.2,<1.0.0",
    "langchain-typesafe>=0.0.1a3",
]
[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "deepeval>=3.7.0,<4.0.0",
    "langchain-community>=0.4.0,<1.0.0",
    "langchain-text-splitters>=1.0.0,<2.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["interview_me*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["interview_me/tests"]
