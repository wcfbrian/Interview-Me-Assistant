services:
  interview-me:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    command: >-
      sh -c "if [ ! -f data/extracted/candidate.json ] || [ ! -f data/github/summaries.json ];
      then uv run python -m backend.cli.ingest; fi;
      chainlit run frontend/chainlit_app.py --host 0.0.0.0 --port 8000"
    restart: unless-stopped